name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Peugeot307CarInfo-v0.11-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot307CarInfo-v0.11-debug
          path: Peugeot307CarInfo-v0.11-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Package source + handoff README
        shell: bash
        run: |
          zip -r Peugeot307CarInfo-v0.11-source.zip .             -x ".git/*"                ".gradle/*"                "app/build/*"                "build/*"                "Peugeot307CarInfo-v0.11-debug.apk"

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Peugeot307CarInfo-v0.11-source
          path: Peugeot307CarInfo-v0.11-source.zip
          if-no-files-found: error
          retention-days: 30
